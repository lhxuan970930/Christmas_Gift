<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ASCII Christmas Tree 2026</title>
<style>
*, *::before, *::after {
box-sizing: border-box;
margin: 0;
padding: 0;
}
html, body {
width: 100%;
height: 100%;
overflow: hidden;
background: #02060a;
display: flex;
align-items: center;
justify-content: center;
user-select: none;
-webkit-user-select: none;
touch-action: manipulation;
}
#stage {
display: block;
background: #02060a;
}
#bgmToggle {
position: fixed;
top: 12px;
left: 12px;
z-index: 10;
background: rgba(2, 6, 10, 0.55);
border: 1px solid rgba(96, 104, 122, 0.45);
color: rgb(255, 196, 90);
font-family: Consolas, Menlo, "DejaVu Sans Mono", "Courier New", "Noto Sans TC", monospace;
font-size: 12px;
padding: 4px 9px;
border-radius: 4px;
cursor: pointer;
transition: border-color 0.2s, opacity 0.2s;
opacity: 0.85;
}
#bgmToggle:hover {
opacity: 1;
border-color: rgba(255, 196, 90, 0.75);
}
#bgmToggle.muted {
color: rgb(96, 104, 122);
}
#fxOverlay {
position: fixed;
inset: 0;
width: 100%;
height: 100%;
pointer-events: none;
z-index: 6;
}
/* Entry Camera Permission Modal */
#camModal {
position: fixed;
inset: 0;
z-index: 30;
display: flex;
align-items: center;
justify-content: center;
padding: 20px;
background: radial-gradient(circle at 50% 40%, rgba(10, 22, 42, 0.86), rgba(2, 6, 10, 0.94));
backdrop-filter: blur(8px);
-webkit-backdrop-filter: blur(8px);
transition: opacity 0.45s ease;
}
#camModal.hidden {
opacity: 0;
pointer-events: none;
}
.cam-card {
width: 100%;
max-width: 410px;
background: rgba(11, 19, 34, 0.88);
border: 1px solid rgba(255, 196, 90, 0.36);
border-radius: 16px;
padding: 28px 24px 24px;
text-align: center;
color: #f3ead8;
font-family: "Noto Sans TC", "PingFang TC", -apple-system, BlinkMacSystemFont, sans-serif;
box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
}
.cam-badge {
display: inline-block;
font-size: 11px;
letter-spacing: 0.2em;
color: rgb(255, 196, 90);
border: 1px solid rgba(255, 196, 90, 0.35);
border-radius: 999px;
padding: 4px 12px;
margin-bottom: 14px;
}
.cam-title {
font-size: 21px;
font-weight: 600;
color: #faecd0;
margin-bottom: 10px;
letter-spacing: 0.06em;
}
.cam-desc {
font-size: 13px;
line-height: 1.75;
color: rgba(243, 234, 216, 0.78);
margin-bottom: 16px;
}
.cam-steps {
text-align: left;
background: rgba(255, 255, 255, 0.04);
border: 1px solid rgba(255, 196, 90, 0.16);
border-radius: 10px;
padding: 12px 14px;
margin-bottom: 18px;
font-size: 12.5px;
line-height: 1.8;
color: rgba(243, 234, 216, 0.88);
}
.cam-steps b {
color: rgb(255, 196, 90);
font-weight: 500;
}
.cam-btn-primary {
width: 100%;
padding: 13px 18px;
border-radius: 999px;
border: 1px solid rgba(255, 215, 130, 0.8);
background: linear-gradient(135deg, #f3d9a4, #e5b860);
color: #091224;
font-size: 14px;
font-weight: 600;
letter-spacing: 0.06em;
cursor: pointer;
margin-bottom: 10px;
transition: transform 0.15s ease, filter 0.2s ease;
}
.cam-btn-primary:hover:not(:disabled) {
transform: translateY(-1px);
filter: brightness(1.05);
}
.cam-btn-primary:disabled {
opacity: 0.6;
cursor: not-allowed;
}
.cam-btn-secondary {
width: 100%;
padding: 9px 14px;
border-radius: 999px;
border: 1px solid rgba(243, 234, 216, 0.22);
background: transparent;
color: rgba(243, 234, 216, 0.72);
font-size: 12px;
cursor: pointer;
transition: border-color 0.2s, color 0.2s;
}
.cam-btn-secondary:hover {
border-color: rgba(255, 196, 90, 0.55);
color: #faecd0;
}
.cam-privacy {
margin-top: 12px;
font-size: 11px;
color: rgba(243, 234, 216, 0.48);
}
#camError {
margin-top: 10px;
font-size: 12px;
color: #f4978e;
min-height: 16px;
}
/* Top Gesture Prompt HUD */
#gestureHud {
position: fixed;
top: 12px;
left: 50%;
transform: translateX(-50%);
z-index: 15;
display: none;
flex-direction: column;
align-items: center;
gap: 5px;
max-width: min(92vw, 440px);
padding: 9px 18px;
border-radius: 14px;
background: rgba(6, 13, 24, 0.76);
border: 1px solid rgba(255, 196, 90, 0.34);
backdrop-filter: blur(10px);
-webkit-backdrop-filter: blur(10px);
color: #faecd0;
font-family: "Noto Sans TC", "PingFang TC", -apple-system, sans-serif;
text-align: center;
pointer-events: none;
transition: opacity 0.35s ease;
}
#gestureHud.active {
display: flex;
}
.hud-step-row {
display: flex;
align-items: center;
gap: 8px;
font-size: 13.5px;
font-weight: 500;
letter-spacing: 0.04em;
}
.hud-tag {
font-size: 11px;
padding: 2px 8px;
border-radius: 999px;
background: rgba(255, 196, 90, 0.18);
border: 1px solid rgba(255, 196, 90, 0.45);
color: rgb(255, 196, 90);
white-space: nowrap;
}
#hudSub {
font-size: 11.5px;
color: rgba(243, 234, 216, 0.75);
}
/* Mini Mirrored Camera Preview */
#camPreviewWrap {
position: fixed;
top: 52px;
left: 12px;
z-index: 14;
display: none;
width: 118px;
border-radius: 10px;
overflow: hidden;
border: 1px solid rgba(255, 196, 90, 0.35);
background: #050a12;
box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
}
#camPreviewWrap.active {
display: block;
}
#camVideo {
display: block;
width: 100%;
height: 88px;
object-fit: cover;
transform: scaleX(-1);
}
#camStatusBar {
display: flex;
align-items: center;
justify-content: space-between;
padding: 3px 7px;
font-size: 10px;
font-family: "Noto Sans TC", sans-serif;
color: rgba(243, 234, 216, 0.78);
background: rgba(4, 9, 18, 0.9);
}
.cam-dot {
display: inline-block;
width: 6px;
height: 6px;
border-radius: 50%;
background: #6b7280;
margin-right: 4px;
vertical-align: middle;
}
.cam-dot.hand-ok {
background: #4ade80;
box-shadow: 0 0 6px #4ade80;
}
/* Bottom-left Fallback / Replay Controls */
#gestureActions {
position: fixed;
bottom: 54px;
right: 14px;
z-index: 16;
display: none;
flex-direction: column;
align-items: flex-end;
gap: 8px;
}
#gestureActions.active {
display: flex;
}
.action-pill {
padding: 7px 13px;
border-radius: 999px;
border: 1px solid rgba(255, 196, 90, 0.42);
background: rgba(6, 13, 24, 0.76);
color: rgb(255, 196, 90);
font-family: "Noto Sans TC", sans-serif;
font-size: 11.5px;
letter-spacing: 0.04em;
cursor: pointer;
backdrop-filter: blur(8px);
-webkit-backdrop-filter: blur(8px);
transition: background 0.2s, transform 0.15s;
}
.action-pill:hover {
background: rgba(255, 196, 90, 0.18);
}
.action-pill.subtle {
border-color: rgba(176, 168, 196, 0.35);
color: rgba(243, 234, 216, 0.78);
}
@media (max-width: 520px) {
#camPreviewWrap {
width: 96px;
top: 48px;
left: 8px;
}
#camVideo {
height: 72px;
}
#gestureHud {
top: 48px;
padding: 7px 12px;
}
.hud-step-row {
font-size: 12px;
}
}
</style>
</head>
<body>
<button id="bgmToggle" type="button" aria-label="Toggle Christmas Music">♪ 音樂：開</button>
<canvas id="stage" aria-label="ASCII Christmas Tree 2026"></canvas>
<canvas id="fxOverlay" aria-hidden="true"></canvas>
<div id="camModal" role="dialog" aria-modal="true" aria-labelledby="camTitle">
<div class="cam-card">
<div class="cam-badge">INTERACTIVE CHRISTMAS 2026</div>
<h1 class="cam-title" id="camTitle">用手勢親手點亮聖誕樹</h1>
<p class="cam-desc">開啟前置鏡頭，跟著四個手勢步驟把這棵聖誕樹一步步佈置完成。</p>
<div class="cam-steps">
<div><b>1. 單手向上滑</b> — 立起聖誕樹</div>
<div><b>2. 空中畫圓 × 3 圈</b> — 纏繞彩帶與燈串</div>
<div><b>3. 由上往下畫</b> — 放上樹頂星星</div>
<div><b>4. 握拳再張開 × 5 次</b> — 一次放上一個禮物</div>
</div>
<button type="button" class="cam-btn-primary" id="enableCamBtn">開啟鏡頭，開始體驗</button>
<button type="button" class="cam-btn-secondary" id="skipCamBtn">先不開鏡頭（改用點擊觸發）</button>
<div id="camError" role="status" aria-live="polite"></div>
<p class="cam-privacy">鏡頭畫面僅在你的裝置本地即時辨識手勢，不會錄影或上傳。</p>
</div>
</div>
<div id="gestureHud" aria-live="polite">
<div class="hud-step-row">
<span class="hud-tag" id="hudStepTag">1 / 4</span>
<span id="hudPrompt">單手由下往上滑，立起聖誕樹</span>
</div>
<div id="hudSub">將手舉到鏡頭前，向上揮動</div>
</div>
<div id="camPreviewWrap">
<video id="camVideo" playsinline muted autoplay></video>
<div id="camStatusBar">
<span><span class="cam-dot" id="camDot"></span><span id="camDotText">等待手部</span></span>
</div>
</div>
<div id="gestureActions">
<button type="button" class="action-pill" id="manualStepBtn">手動觸發這一步</button>
<button type="button" class="action-pill subtle" id="replayGestureBtn" style="display:none;">重新佈置一次</button>
</div>
<script>
(() => {
'use strict';
// =========================================================================
// Constants directly ported from christmas_tree.py
// =========================================================================
const COLS = 66;
const ROWS = 74;
const CW = 12;
const CH = 14;
const FONT_PX = 14;
const CJK_PX = 11.5;
const HUD_PX = 13;
const CANVAS_W = COLS * CW; // 792
const CANVAS_H = ROWS * CH; // 1036
const ASPECT = CW / CH;
const TAU = Math.PI * 2;
const GROUND = -1.48;
const Y0 = -0.86;
const Y1 = 1.34;
// Timeline (seconds) matching the video sequence
const T_GROW    = [1.0, 5.4];
const T_GARLAND = [5.4, 7.6];
const T_BALLS   = [7.6, 8.9];
const T_LIGHTS  = [8.2, 11.2];
const T_GIFTS   = [9.8, 12.2];
const T_STAR    = 12.2;
const T_MSG     = 13.1;
const MESSAGE = 'M E R R Y   C H R I S T M A S   2 0 2 6';
// Repeating Chinese greeting characters replacing the ASCII tree glyphs
const REPEAT_TEXT = '祝家祺聖誕快樂';
const REPEAT_LEN = REPEAT_TEXT.length;
function repeatCharCode(row, col) {
return REPEAT_TEXT.charCodeAt((col + row) % REPEAT_LEN);
}
// Colors (0..1 RGB) matching christmas_tree.py
const WHITE       = [0.95, 0.98, 1.00];
const GOLD        = [1.00, 0.84, 0.30];
const BAUBLE_GOLD = [1.00, 0.80, 0.25];
const SILVER      = [0.88, 0.92, 0.98];
const RED         = [0.98, 0.16, 0.18];
const BLUE        = [0.18, 0.46, 1.00];
const GREEN_BOX   = [0.18, 0.82, 0.36];
const WARM        = [1.00, 0.88, 0.50];
const TRUNK_COL   = [0.64, 0.37, 0.18];
const HUD_DIM    = 'rgb(96, 104, 122)';
const HUD_ACCENT = 'rgb(255, 196, 90)';
const HUD_SIGN   = 'rgb(176, 168, 196)';
// Particle types
const PT_NEEDLE = 0;
const PT_SNOW   = 1;
const PT_TRUNK  = 2;
const PT_TINSEL = 3;
const PT_BALL   = 4;
const PT_LIGHT  = 5;
const PT_GIFT   = 6;
const PT_GROUND = 7;
// =========================================================================
// Deterministic PRNG (Mulberry32, seeded to 7 like np.random.default_rng(7))
// =========================================================================
function createRng(seed) {
let a = seed >>> 0;
function next() {
a |= 0;
a = (a + 0x6d2b79f5) | 0;
let t = Math.imul(a ^ (a >>> 15), 1 | a);
t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
let spare = null;
return {
random: next,
uniform(lo, hi) {
return lo + (hi - lo) * next();
},
normal(mean = 0, std = 1) {
if (spare !== null) {
const v = spare;
spare = null;
return mean + std * v;
}
let u = 0, v = 0;
while (u === 0) u = next();
while (v === 0) v = next();
const mag = Math.sqrt(-2.0 * Math.log(u));
spare = mag * Math.sin(TAU * v);
return mean + std * (mag * Math.cos(TAU * v));
}
};
}
function clip(v, lo, hi) {
return v < lo ? lo : v > hi ? hi : v;
}
function smoothstep(x) {
const t = clip(x, 0, 1);
return t * t * (3 - 2 * t);
}
function envelope(y) {
const u = clip((y - Y0) / (Y1 - Y0), 0, 1);
return 0.96 * Math.pow(1 - u, 0.92);
}
function growTime(y) {
const f = clip((y - GROUND) / (Y1 - GROUND), 0, 1);
return f * 2.2;
}
function fibSphere(n) {
const pts = [];
const golden = Math.PI * (3 - Math.sqrt(5));
for (let i = 0; i < n; i++) {
const y = 1 - (i / (n - 1)) * 2;
const r = Math.sqrt(Math.max(0, 1 - y * y));
const theta = golden * i;
pts.push([Math.cos(theta) * r, y, Math.sin(theta) * r]);
}
return pts;
}
// =========================================================================
// Particle storage (Structure of Arrays for fast projection)
// =========================================================================
class Parts {
constructor(cap) {
this.cap = cap;
this.len = 0;
this.x     = new Float32Array(cap);
this.y     = new Float32Array(cap);
this.z     = new Float32Array(cap);
this.nx    = new Float32Array(cap);
this.ny    = new Float32Array(cap);
this.nz    = new Float32Array(cap);
this.r     = new Float32Array(cap);
this.g     = new Float32Array(cap);
this.b     = new Float32Array(cap);
this.type  = new Uint8Array(cap);
this.t0    = new Float32Array(cap);
this.base  = new Float32Array(cap);
this.phase = new Float32Array(cap);
this.cx    = new Float32Array(cap);
this.cy    = new Float32Array(cap);
this.cz    = new Float32Array(cap);
this.pop   = new Uint8Array(cap);
this.tier  = new Uint8Array(cap);
}
push(x, y, z, nx, ny, nz, r, g, b, type, t0, base = 1.0, phase = 0.0, cx = 0, cy = 0, cz = 0, pop = 0, tier = 0) {
const i = this.len;
if (i >= this.cap) return;
this.x[i] = x; this.y[i] = y; this.z[i] = z;
const nlen = Math.hypot(nx, ny, nz) || 1;
this.nx[i] = nx / nlen; this.ny[i] = ny / nlen; this.nz[i] = nz / nlen;
this.r[i] = r; this.g[i] = g; this.b[i] = b;
this.type[i] = type;
this.t0[i] = t0;
this.base[i] = base;
this.phase[i] = phase;
this.cx[i] = cx; this.cy[i] = cy; this.cz[i] = cz;
this.pop[i] = pop;
this.tier[i] = tier;
this.len = i + 1;
}
}
// =========================================================================
// Build the 3D scene faithfully following christmas_tree.py
// =========================================================================
function buildScene() {
const rng = createRng(7);
const q = new Parts(85000);
const tips = [];
const lightStartTimes = [];
// 1. Needles: 24 whorls of drooping branches, denser & longer at the bottom
const WHORLS = 24;
for (let i = 0; i < WHORLS; i++) {
const y = (Y0 + 0.02) + ((Y1 - 0.06) - (Y0 + 0.02)) * (i / (WHORLS - 1));
const u = (y - Y0) / (Y1 - Y0);
const R = envelope(y) + 0.05;
const nb = Math.floor(6 + 12 * (1 - u));
for (let b = 0; b < nb; b++) {
const a = TAU * (b + 0.5 * rng.random()) / nb + i * 0.77;
const L = R * rng.uniform(0.85, 1.08);
const n = Math.floor(25 + 240 * L);
const dx = Math.cos(a), dz = Math.sin(a);
const sx = -Math.sin(a), sz = Math.cos(a);
for (let k = 0; k < n; k++) {
const s = Math.pow(rng.random(), 0.65); // 0 trunk .. 1 tip
const spread = (0.025 + 0.09 * s) * rng.normal(0, 1);
const s1 = s * L;
const px = dx * s1 + sx * spread;
const pz = dz * s1 + sz * spread;
const py = y + 0.06 * s1 - 0.20 * s1 * s1 + 0.012 * rng.normal(0, 1);
const nrmX = dx * 0.75 + 0.3 * rng.normal(0, 1);
const nrmY = 0.55 + 0.3 * rng.normal(0, 1);
const nrmZ = dz * 0.75 + 0.3 * rng.normal(0, 1);
const nlen = Math.hypot(nrmX, nrmY, nrmZ) || 1;
const nyUnit = nrmY / nlen;
const ao = (0.35 + 0.70 * Math.pow(s, 1.25)) * rng.uniform(0.78, 1.12);
const isSnow = (s > 0.5) && (rng.random() < 0.06 * s) && (nyUnit > 0.5);
let cr, cg, cb, ptype, pbase;
if (isSnow) {
cr = WHITE[0]; cg = WHITE[1]; cb = WHITE[2];
ptype = PT_SNOW;
pbase = 1.05;
} else {
const gRand = rng.random();
cr = 0.10 + 0.14 * gRand;
cg = 0.50 + 0.42 * gRand;
cb = 0.18 + 0.16 * gRand;
ptype = PT_NEEDLE;
pbase = ao;
}
q.push(px, py, pz, nrmX, nrmY, nrmZ, cr, cg, cb, ptype, growTime(y) + 0.45 * s, pbase);
}
const tl = 0.93 * L;
tips.push([dx * tl, y + 0.06 * tl - 0.20 * tl * tl, dz * tl]);
}
}
// 2. Dark inner cone so nothing shows through the branches
const mCone = 6000;
for (let i = 0; i < mCone; i++) {
const y = Y0 + (Y1 - 0.1 - Y0) * rng.random();
const phi = rng.random() * TAU;
const r = 0.65 * envelope(y);
const px = Math.cos(phi) * r;
const pz = Math.sin(phi) * r;
q.push(px, y, pz, Math.cos(phi), 0.3, Math.sin(phi), 0.10, 0.44, 0.16, PT_NEEDLE, growTime(y), 0.75);
}
// 3. Trunk (taller & fuller warm brown bark)
const mTrunk = 2600;
for (let i = 0; i < mTrunk; i++) {
const y = GROUND + rng.random() * (Y0 + 0.14 - GROUND);
const phi = rng.random() * TAU;
const nx = Math.cos(phi), nz = Math.sin(phi);
const bark = 0.78 + 0.22 * Math.sign(Math.sin(phi * 26 + y * 5) || 1);
const rad = 0.135;
q.push(
nx * rad, y, nz * rad,
nx, 0, nz,
TRUNK_COL[0] * bark, TRUNK_COL[1] * bark, TRUNK_COL[2] * bark,
PT_TRUNK, growTime(y), 1.05
);
}
// 4. Tinsel garland: 3 circles (lower gold, middle crimson-gold, upper champagne shimmer)
const tinselSteps = 2400;
const turns = 4.5;
for (let strand = 0; strand < 4; strand++) {
for (let i = 0; i < tinselSteps; i++) {
const u = i / (tinselSteps - 1);
const tier = Math.min(2, Math.floor(u * 3));
const localU = (u * 3) - tier;
const yg = Y0 + 0.12 + (Y1 - Y0 - 0.40) * u;
const ag = TAU * turns * u + 0.9;
const swag = -0.07 * Math.abs(Math.sin(ag * 2.5));
const rg = envelope(yg) + 0.075;
const jitter = 0.016;
const px = Math.cos(ag) * rg + jitter * rng.normal(0, 1);
const py = yg + swag + jitter * rng.normal(0, 1);
const pz = Math.sin(ag) * rg + jitter * rng.normal(0, 1);
const nx = Math.cos(ag) + 0.6 * rng.normal(0, 1);
const ny = 0.3 + 0.6 * rng.normal(0, 1);
const nz = Math.sin(ag) + 0.6 * rng.normal(0, 1);
const col = (tier === 1 && strand % 2 === 1) ? RED : (tier === 2 && strand % 2 === 1 ? WARM : GOLD);
const t0 = localU * 0.95;
q.push(px, py, pz, nx, ny, nz, col[0], col[1], col[2], PT_TINSEL, t0, 1.0, rng.random() * TAU, 0, 0, 0, 0, tier);
}
}
// 5. Baubles: 34 spheres (mostly red, some gold and silver)
const baubleSphere = fibSphere(110);
for (let k = 0; k < 34; k++) {
const u = (k + rng.random()) / 34;
const y = Y0 + 0.08 + u * (Y1 - Y0 - 0.38);
const a = k * 2.39996 + rng.random() * 0.4;
const env = envelope(y);
const cx = Math.cos(a) * env;
const cy = y - 0.03;
const cz = Math.sin(a) * env;
const rad = 0.058 + 0.032 * (1 - u);
const col = (k % 2 === 0) ? RED : (k % 5 === 1 ? SILVER : BAUBLE_GOLD);
const tier = Math.min(2, Math.floor(u * 3));
const t0 = 0.35 + rng.random() * 0.65;
for (let j = 0; j < baubleSphere.length; j++) {
const s = baubleSphere[j];
q.push(
cx + s[0] * rad, cy + s[1] * rad, cz + s[2] * rad,
s[0], s[1], s[2],
col[0], col[1], col[2],
PT_BALL, t0, 1.0, 0.0, cx, cy, cz, 1, tier
);
}
}

// 5-pointed star polygon & 8-ray burst (exact port of lines 359-424)

const x1 = poly[i][0], y1 = poly[i][1];
const x2 = poly[j][0], y2 = poly[j][1];
const intersect = ((y1 > py) !== (y2 > py)) &&

GOLD[1] + (1 - GOLD[1]) * flash,
GOLD[2] + (1 - GOLD[2]) * flash

fxCtx.arc(hx, hy, 22, 0, TAU);
fxCtx.fill();
}
// Draw celebratory spark bursts
for (let i = fxParticles.length - 1; i >= 0; i--) {
const p = fxParticles[i];
p.x += p.vx;
p.y += p.vy;
p.vy += 0.08;
p.life -= 0.022;
if (p.life <= 0) {
fxParticles.splice(i, 1);
continue;
}
fxCtx.fillStyle = p.gold
? ⁠rgba(255, 214, 112, ${p.life.toFixed(3)})⁠
: ⁠rgba(255, 250, 235, ${p.life.toFixed(3)})⁠;
fxCtx.beginPath();
fxCtx.arc(p.x, p.y, p.r * p.life, 0, TAU);
fxCtx.fill();
}
}
requestAnimationFrame(renderFxOverlay);
async function initHandLandmarker() {
let mp;
try {
mp = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
} catch () {
mp = await import('https://unpkg.com/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
}
const { FilesetResolver, HandLandmarker } = mp;
const vision = await FilesetResolver.forVisionTasks(
'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
);
const modelUrl = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
try {
return await HandLandmarker.createFromOptions(vision, {
baseOptions: { modelAssetPath: modelUrl, delegate: 'GPU' },
runningMode: 'VIDEO',
numHands: 1,
minHandDetectionConfidence: 0.52,
minHandPresenceConfidence: 0.52,
minTrackingConfidence: 0.5
});
} catch () {
return await HandLandmarker.createFromOptions(vision, {
baseOptions: { modelAssetPath: modelUrl, delegate: 'CPU' },
runningMode: 'VIDEO',
numHands: 1,
minHandDetectionConfidence: 0.52,
minHandPresenceConfidence: 0.52,
minTrackingConfidence: 0.5
});
}
}
enableCamBtn.addEventListener('click', async () => {
unlockOnGesture();
camError.textContent = '';
enableCamBtn.disabled = true;
enableCamBtn.textContent = '正在開啟鏡頭與載入手勢模型...';
try {
if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
throw new Error('NO_MEDIA_DEVICES');
}
const stream = await navigator.mediaDevices.getUserMedia({
video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
audio: false
});
camVideo.srcObject = stream;
await camVideo.play();
handLandmarker = await initHandLandmarker();
cameraActive = true;
camPreviewWrap.classList.add('active');
camModal.classList.add('hidden');
stageState.step = 1;
cooldownUntil = performance.now() + 600;
updateHud();
} catch (err) {
enableCamBtn.disabled = false;
enableCamBtn.textContent = '重新嘗試開啟鏡頭';
const name = err && err.name ? err.name : '';
if (name === 'NotAllowedError' || name === 'PermissionDeniedError') {
camError.textContent = '鏡頭權限被拒絕了，請在瀏覽器允許相機權限，或點下方改用點擊體驗。';
} else {
camError.textContent = '無法啟用鏡頭或載入手勢模型，你可以改用下方「點擊觸發」體驗。';
}
}
});
skipCamBtn.addEventListener('click', () => {
unlockOnGesture();
cameraActive = false;
camModal.classList.add('hidden');
stageState.step = 1;
updateHud();
});
})();
</script>
